# =============================================================================
# Bloomy's Bud Log — Update Strains (manual fallback only)
# =============================================================================
# The daily update runs from the home server's cron (scripts/daily_update.sh)
# because medibud.co.uk sits behind Cloudflare, which 403s GitHub's
# datacenter IPs. This workflow exists only for manual runs from the
# Actions tab — expect it to fail on the feed fetch unless MediBud
# unblocks datacenter traffic.
# =============================================================================

name: Update Strain Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-strains:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install beautifulsoup4 requests

      - name: Run strain updater
        run: python scripts/update_strains.py

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push updates
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "Bloomy's Bot"
          git config user.email "bot@bloomys-bud-log.github.io"
          git add strains.json reviews.json index.html
          STRAIN_COUNT=$(python -c "import json; print(len(json.load(open('strains.json'))))")
          REVIEW_COUNT=$(python -c "import json; print(len(json.load(open('reviews.json'))))" 2>/dev/null || echo "0")
          git commit -m "🌿 Auto-update: $STRAIN_COUNT strains, $REVIEW_COUNT reviews"
          git push

      - name: No changes detected
        if: steps.changes.outputs.changed == 'false'
        run: echo "✅ No new strain data — everything is up to date."
